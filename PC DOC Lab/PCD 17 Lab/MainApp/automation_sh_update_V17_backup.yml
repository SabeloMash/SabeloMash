    - name: Download grub.cfg file
      ansible.builtin.get_url:
        url: "http://10.10.15.225:10880/johnathans/Deployment/raw/branch/main/pcdoctor/grub.cfg"
        dest: "/tmp/grub.cfg"
        mode: '0755'  # Make the file executable
        headers:
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:89.0) Gecko/20100101 Firefox/89.0"

    - name: Replace the existing grub.cfg file in folder pcdoctor/sc_and/scripts
      ansible.builtin.copy:
        src: "/tmp/grub.cfg"
        dest: "/media/PC_DOCTOR.vfat/boot/grub/grub.cfg"
        mode: '0755'  # Ensure the file remains executable
        remote_src: true  # Look for the file on the remote host
        backup: false  # Optional: Create a backup of the original file before replacing it

    - name: Download grub32.cfg file
      ansible.builtin.get_url:
        url: "http://10.10.15.225:10880/johnathans/Deployment/raw/branch/main/pcdoctor/grub32.cfg"
        dest: "/tmp/grub32.cfg"
        mode: '0755'  # Make the file executable
        headers:
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:89.0) Gecko/20100101 Firefox/89.0"

