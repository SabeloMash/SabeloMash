      ansible.builtin.copy:
        src: "/tmp/grub32.cfg"
        dest: "/media/PC_DOCTOR.vfat/boot/grub/grub32.cfg"
        mode: '0755'  # Ensure the file remains executable
        remote_src: true  # Look for the file on the remote host
        backup: false  # Optional: Create a backup of the original file before replacing it

    # Run task to set host variables
    - name: Include SETVARS
      ansible.builtin.include_tasks: ../notouch/general/setvars_targeted.yml

    - name: Set STORENAME in automation.sh
      ansible.builtin.lineinfile:
        path: /media/PC_DOCTOR.vfat/pcdoctor/sc_lin/utilities/automation.sh
        regexp: '^STORENAME='
        line: "STORENAME=\"{{ pcdstorename }}\""
        state: present
        backup: false

    - name: Set REPO_NAME in automation.sh
      ansible.builtin.lineinfile:
        path: /media/PC_DOCTOR.vfat/pcdoctor/sc_lin/utilities/automation.sh
        regexp: '^REPO_NAME='
        line: "REPO_NAME=\"{{ pcd_git_repo_storename }}\""
        state: present
        backup: false

    # Validate the updated automation.sh script for shell syntax errors.
    - name: Verify automation.sh syntax
      ansible.builtin.command:
        cmd: "bash -n /media/PC_DOCTOR.vfat/pcdoctor/sc_lin/utilities/automation.sh"
      register: syntax_check
      ignore_errors: yes  # Allows playbook to continue even if there’s an error
      
    - name: Send a JSON payload to CCTECH Tech Team Chat (include PC Doctor version on failure)
      ansible.builtin.uri:
        url: "{{ msteams_webhook }}"
        method: POST
        headers:
          Content-Type: "application/json"
          body: "{{ {'text': 'PCD USB Update failed for ' + (pcdstorename | default('unknown')) + ' (PCDoctor version: ' + (pcd_major_version | default('unknown')) + ')' } | to_json }}"
        body_format: json
        return_content: true
        status_code: 202
      register: result
      when: syntax_check.rc != 0 

    - name: Fail if syntax is invalid
      ansible.builtin.fail:
        msg: "automation.sh has syntax errors and may be corrupted."
      when: syntax_check.rc != 0

    # Check that the updated automation.sh file is a readable ASCII text file.
    - name: Check file type to ensure it's ASCII text
      ansible.builtin.command:
        cmd: "file /media/PC_DOCTOR.vfat/pcdoctor/sc_lin/utilities/automation.sh"
      register: file_check
      
    - name: Send a JSON payload to CCTECH Tech Team Chat (include PC Doctor version on failure)
      ansible.builtin.uri:
        url: "{{ msteams_webhook }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body: "{{ {'text': 'PCD USB Update failed for ' + (pcdstorename | default('unknown')) + ' (PCDoctor version: ' + (pcd_major_version | default('unknown')) + ')' } | to_json }}"
        body_format: json
        return_content: true
        status_code: 202
      register: result
      when: "'ASCII text' not in file_check.stdout"

    - name: Fail if file is not ASCII text
      ansible.builtin.fail:
        msg: "automation.sh is not a readable ASCII text file."
      when: "'ASCII text' not in file_check.stdout"

    # Extract the SCRIPTVERSION value from automation.sh so it can be recorded.
    - name: Read the SCRIPTVERSION value from automation.sh
      ansible.builtin.shell: |
        grep '^SCRIPTVERSION=' /media/PC_DOCTOR.vfat/pcdoctor/sc_lin/utilities/automation.sh | cut -d'=' -f2 | tr -d '"'
      register: script_version
      ignore_errors: true

    - name: Display the extracted SCRIPTVERSION value
      ansible.builtin.debug:
        msg: "Extracted SCRIPTVERSION is {{ script_version.stdout }}"

    - name: Write SCRIPTVERSION value to automation_version.txt
      ansible.builtin.lineinfile:
        path: /pcdinfo/automation_version.txt
        regexp: '^SCRIPTVERSION='
        line: "SCRIPTVERSION={{ script_version.stdout }}"
        create: true
        mode: '0755'
      when: script_version.stdout is defined

    - name: Write date to automation_version.txt
      ansible.builtin.lineinfile:
        path: /pcdinfo/automation_version.txt
        regexp: '^PCDUPDATEDATE='
        line: "PCDUPDATEDATE={{ ansible_date_time.date }} {{ ansible_date_time.time }}"
        create: true
        mode: '0755'

    - name: Start Zabbix agent2 service
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted

    # Flush pending writes to the USB device before unmounting it.
    - name: Eject the USB drive
      ansible.builtin.command:
        cmd: "sync"
      changed_when: false

    # Stop any processes still using the mounted USB path so the device can be safely unmounted.
    - name: Stop any processes using the USB mount
      ansible.builtin.command:
        cmd: "lsof +D /media/PC_DOCTOR.vfat 2>/dev/null | awk '{print $2}' | xargs -r kill -9"
      ignore_errors: true
      changed_when: false

    # Force-unmount the USB to release it even if processes are still holding it open.
    - name: Unmount USB with lazy option
      ansible.builtin.command:
        cmd: "umount -l /media/PC_DOCTOR.vfat"
      ignore_errors: true

    # Wait until the USB is fully released before continuing.
    - name: Wait for unmount to complete
      ansible.builtin.command:
        cmd: "while fuser -m /media/PC_DOCTOR.vfat 2>/dev/null; do sleep 1; done"
      ignore_errors: true
      changed_when: false

    # Eject the USB device from the system after unmounting it.
    - name: Eject USB device
      ansible.builtin.command:
        cmd: "eject /media/PC_DOCTOR.vfat"
      ignore_errors: true

    - name: Pause to allow hardware ejection
      ansible.builtin.pause:
        seconds: 5

    - name: Restart USB mount trigger for next update
      ansible.builtin.systemd:
        name: usb-mount-trigger.path
        state: started
      ignore_errors: true
    
    - name: Pause before final notification
      ansible.builtin.pause:
        seconds: 5

    - name: Send a JSON payload to CCTECH Tech Team Chat (include PC Doctor version on success)
      ansible.builtin.uri:
        url: "{{ msteams_webhook }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body: "{{ {'text': 'PCD USB Update to ' + (script_version.stdout | default('unknown')) + ' done successfully for ' + (pcdstorename | default('unknown')) + ' (PCDoctor version: ' + (pcd_major_version | default('unknown')) + ')' } | to_json }}"
        body_format: json
        return_content: true
        status_code: 202
      register: result