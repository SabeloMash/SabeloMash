# CCTECH Store Repository Viewer - Ansible Inventory
# This file defines the hosts where the webapp will be deployed

[all:vars]
# Ansible connection settings
ansible_user=ansible
ansible_connection=ssh
ansible_ssh_private_key_file=~/.ssh/cctech_ansible_key
ansible_python_interpreter=/usr/bin/python3

[stores]
# Add your store servers here with their hostnames
# Examples:
# teststore1.cctech.local
# teststore2.cctech.local
# teststore3.cctech.local
teststore3 ansible_host=192.168.1.50
# teststore4 ansible_host=192.168.1.51
# teststore5 ansible_host=192.168.1.52

[stores:vars]
# Store-specific variables
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# Local testing
[local]
localhost ansible_connection=local

[local:vars]
ansible_become=yes
